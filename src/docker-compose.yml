x-airflow-common: &airflow-common
  image: fraud-detection-airflow:latest
  environment:
    # Use CeleryExecutor with 2 workers for better parallel task execution.
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    # Limit default parallelism for local development to avoid resource exhaustion
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__WEBSERVER__WORKERS: '2'
    # Use local Postgres for Airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    # Celery result backend
    AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    AIRFLOW__CELERY__BROKER_URL: "redis://:@redis:6379/0"
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW__CORE__FERNET_KEY:?Set AIRFLOW__CORE__FERNET_KEY in src/.env (run scripts/generate_fernet_key.sh)}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    # If you want to use it, outcomment it and replace airflow.cfg with the name of your config file
    # AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    MLFLOW_TRACKING_URI: 'http://mlflow-server:5500'
    MLFLOW_S3_ENDPOINT_URL: 'http://minio:9000'
    # Transactions DB connection (used by training/inference plugins)
    TRANSACTIONS_HOST: ${POSTGRES_HOST:-postgres}
    TRANSACTIONS_PORT: ${POSTGRES_PORT:-5432}
    TRANSACTIONS_DB: ${POSTGRES_TRANSACTIONS_DB:-transactions_db}
    TRANSACTIONS_USER: ${POSTGRES_TRANSACTIONS_USER:-fraud_training}
    TRANSACTIONS_PASSWORD: ${POSTGRES_TRANSACTIONS_PASSWORD:?set POSTGRES_TRANSACTIONS_PASSWORD in src/.env}

    # Increase heartbeat interval and timeout to tolerate transient DB/network issues in long-running tasks
    # During hyperparameter tuning, CV folds may temporarily lock many connections
    AIRFLOW__JOBS__JOB_HEARTBEAT_SEC: '120'
    AIRFLOW__JOBS__JOB_HEARTBEAT_FAILURE_THRESHOLD: '20'
    # Celery broker connection settings
    AIRFLOW__CELERY__BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
    AIRFLOW__CELERY__BROKER_CONNECTION_MAX_RETRIES: '10'
    # Celery visibility timeout (task can run longer before being considered lost)
    AIRFLOW__CELERY__VISIBILITY_TIMEOUT: '3600'
    # Database connection pool settings to prevent connection exhaustion
    # Increased to handle CV folds and task monitoring simultaneously
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '20'
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '10'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: '600'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_TIMEOUT: '30'
    # Ensure Airflow constructs valid served-log URLs (host + port)
    # Set to the host that the browser will use to access Airflow webserver.
    # For local development use 'localhost'. For multi-host deployments set this
    # to a resolvable hostname reachable by your browser.
    AIRFLOW__LOGGING__LOG_SERVER_HOST: "localhost"
    AIRFLOW__LOGGING__LOG_SERVER_PORT: "8793"
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ./models:/app/models
    - ./config.yaml:/app/config.yaml
    - ./.env:/app/.env
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in src/.env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=500"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}" ]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-airflow}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    command: [ "--redis.addr", "redis:6379" ]
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis

  airflow-webserver:
    <<: *airflow-common
    build:
      context: ..
      dockerfile: src/airflow/Dockerfile
    command: webserver
    ports:
      - "8080:8080"
      - "127.0.0.1:8793:8793"
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "1000"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "1000"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      RATELIMIT_STORAGE_URL: "redis://:@redis:6379/1"
      AIRFLOW__LOGGING__LOG_SERVER_HOST: "localhost"
      AIRFLOW__LOGGING__LOG_SERVER_PORT: "8793"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8974/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
      AIRFLOW__CELERY__TASK_SOFT_TIME_LIMIT: "2700"
      AIRFLOW__CELERY__TASK_TIME_LIMIT: "2800"
      AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: "1"
      AIRFLOW__CELERY__WORKER_MAX_TASKS_PER_CHILD: "50"
      AIRFLOW__CELERY__WORKER_HEARTBEAT_SEC: "60"
      AIRFLOW__CELERY__BROKER_POOL_LIMIT: "10"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        echo "Airflow directories initialized successfully"
        timeout 120 /entrypoint airflow version || echo "Airflow version check timed out"
        exit 0
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?set _AIRFLOW_WWW_USER_PASSWORD in src/.env}
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:5555/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  minio:
    restart: always
    image: minio/minio
    platform: linux/amd64
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ':9001' --address ':9000'
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - minio_data:/data

  mc:
    image: minio/mc
    platform: linux/amd64
    depends_on:
      - minio
    container_name: mc
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c ' echo "Waiting for MinIO to become ready..."; i=0; until /usr/bin/mc alias set minio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY}; do i=$$((i+1)); echo retry $$i; sleep 2; done; /usr/bin/mc mb --ignore-existing minio/mlflow; exit 0; '

  mlflow-server:
    restart: always
    build:
      context: ..
      dockerfile: src/mlflow/Dockerfile
    image: fraud-detection-mlflow:latest
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:5500:5500"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - 'MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in src/.env}@postgres:${POSTGRES_PORT:-5432}/${MLFLOW_DB_NAME:-mlflow}?sslmode=${DB_SSLMODE:-prefer}'
      - 'MLFLOW_ARTIFACTS_DESTINATION=s3://mlflow/fraud_detection'
      - MLFLOW_SERVER_HOST=0.0.0.0
      - SERVER_NAME=mlflow-server
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5500/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  inference:
    build:
      context: ..
      dockerfile: src/inference/Dockerfile
    image: fraud-detection-inference:latest
    container_name: inference-service
    env_file: .env
    environment:
      - INFERENCE_PORT=${INFERENCE_PORT:-8000}
      # Database connection for fetching transactions and saving predictions
      - DB_HOST=${POSTGRES_HOST:-postgres}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${POSTGRES_TRANSACTIONS_DB:-transactions_db}
      - DB_USER=${POSTGRES_TRANSACTIONS_USER:-fraud_producer}
      - DB_PASSWORD=${POSTGRES_TRANSACTIONS_PASSWORD:?set POSTGRES_TRANSACTIONS_PASSWORD in src/.env}
      - CONTINUOUS_INFERENCE_INTERVAL=0.2
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
      - inference-data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - postgres
      - mlflow-server

  Moniguard:
    build: ../moniguard
    image: fraud-detection-moniguard:latest
    container_name: Moniguard-web
    # env_file must provide SECRET_KEY (>= 32 chars) and the MONIGUARD_*_PASSWORD values; the dashboard refuses to start without SECRET_KEY.
    env_file: .env
    environment:
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL:-http://inference:8000}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow-server:5500}
      - AIRFLOW_WEBSERVER_URL=${AIRFLOW_WEBSERVER_URL:-http://airflow-webserver:8080}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
      - FLOWER_URL=${FLOWER_URL:-http://flower:5555}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      # Database connection for direct fraud_predictions queries
      - DB_HOST=${POSTGRES_HOST:-postgres}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${POSTGRES_TRANSACTIONS_DB:-transactions_db}
      - DB_USER=${POSTGRES_TRANSACTIONS_USER:-fraud_producer}
      - DB_PASSWORD=${POSTGRES_TRANSACTIONS_PASSWORD:?set POSTGRES_TRANSACTIONS_PASSWORD in src/.env}
      - CONTINUOUS_INFERENCE_INTERVAL=0.2
    ports:
      - "5000:5000"
    volumes:
      - ../moniguard/data:/app/data
      - ../moniguard/static:/app/static
      - ../moniguard/templates:/app/templates
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - postgres
      - inference
      - mlflow-server
      - airflow-webserver

  producer:
    build:
      context: ../producer
      dockerfile: Dockerfile
    image: fraud-detection-producer:latest
    container_name: fraud_detection_producer
    profiles:
      - producer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_TRANSACTIONS_DB:-transactions_db}
      DB_USER: ${POSTGRES_TRANSACTIONS_USER:-fraud_producer}
      DB_PASSWORD: ${POSTGRES_TRANSACTIONS_PASSWORD:?set POSTGRES_TRANSACTIONS_PASSWORD in src/.env}
      PRODUCER_INTERVAL: 0.5
      PRODUCER_BATCH_SIZE: ${PRODUCER_BATCH_SIZE:-1}
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../.env:/app/.env
      - ../producer/main.py:/app/main.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - inference
      - mlflow-server

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in src/.env}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - prometheus

volumes:
  postgres-db-volume:
  redis-data:
  minio_data:
  inference-data:
  prometheus-data:
  grafana-data:





