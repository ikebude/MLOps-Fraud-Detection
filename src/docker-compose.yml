x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: src/airflow/Dockerfile
  image: fraud-detection/airflow:latest
  environment: &airflow-common-env
    # Use CeleryExecutor with 2 workers for better parallel task execution.
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    # Limit default parallelism for local development to avoid resource exhaustion
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__WEBSERVER__WORKERS: '2'
    # Use local Postgres for Airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    # Celery result backend
    AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    AIRFLOW__CELERY__BROKER_URL: "redis://:@redis:6379/0"
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    # If you want to use it, outcomment it and replace airflow.cfg with the name of your config file
    # AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    MLFLOW_TRACKING_URI: 'http://mlflow-server:5000'
    MLFLOW_S3_ENDPOINT_URL: 'http://minio:9000'
    # Increase heartbeat interval and timeout to tolerate transient DB/network issues in long-running tasks
    # During hyperparameter tuning, CV folds may temporarily lock many connections
    AIRFLOW__JOBS__JOB_HEARTBEAT_SEC: '120'
    AIRFLOW__JOBS__JOB_HEARTBEAT_FAILURE_THRESHOLD: '20'
    # Celery broker connection settings
    AIRFLOW__CELERY__BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
    AIRFLOW__CELERY__BROKER_CONNECTION_MAX_RETRIES: '10'
    # Celery visibility timeout (task can run longer before being considered lost)
    AIRFLOW__CELERY__VISIBILITY_TIMEOUT: '3600'
    # Database connection pool settings to prevent connection exhaustion
    # Increased to handle CV folds and task monitoring simultaneously
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '20'
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '10'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: '600'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_TIMEOUT: '30'
    # Ensure Airflow constructs valid served-log URLs (host + port)
    # Set to the host that the browser will use to access Airflow webserver.
    # For local development use 'localhost'. For multi-host deployments set this
    # to a resolvable hostname reachable by your browser.
    AIRFLOW__LOGGING__LOG_SERVER_HOST: "localhost"
    AIRFLOW__LOGGING__LOG_SERVER_PORT: "8793"
    # XGBoost and ingestion limits are controlled via environment (.env) or
    # the later defaults below; avoid duplicate keys in this mapping.
    # Fraud Detection API configuration
    FRAUD_API_URL: ${FRAUD_API_URL:-https://3consult-ng.com/fraud_api.php}
    # Cap records at 150k for comprehensive training on recent fraud data.
    # 150k records = ~3GB peak during feature engineering + training.
    FRAUD_API_MAX_RECORDS: ${FRAUD_API_MAX_RECORDS:-100000}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ./models:/app/models
    - ./config.yaml:/app/config.yaml
    - ./.env:/app/.env
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always
    networks:
      fraud-detection:
        ipv4_address: 172.20.0.2
    # Configure DNS servers for better resolution
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      fraud-detection:
        ipv4_address: 172.20.0.3
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
      - "8793:8793"
    environment:
      <<: *airflow-common-env
      # Increase gunicorn timeout significantly - DAG parsing is very slow
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "1000"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "1000"
      # Use only 1 worker to speed up startup (each worker parses all DAGs)
      AIRFLOW__WEBSERVER__WORKERS: "2"
      # Configure Flask-Limiter to use Redis instead of in-memory storage
      RATELIMIT_STORAGE_URL: "redis://:@redis:6379/1"
      # Expose served-log host and port to the UI
      AIRFLOW__LOGGING__LOG_SERVER_HOST: "localhost"
      AIRFLOW__LOGGING__LOG_SERVER_PORT: "8793"
      # Base URL for webserver used when constructing absolute links
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1.5G
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
      # Celery worker memory and task timeout settings
      # Task timeout: 45 minutes (fraud detection training can take ~10-15 min on 80k records)
      AIRFLOW__CELERY__TASK_SOFT_TIME_LIMIT: "2700"
      AIRFLOW__CELERY__TASK_TIME_LIMIT: "2800"
      # Celery worker pool size and prefetch (reduce memory pressure)
      AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: "1"
      AIRFLOW__CELERY__WORKER_MAX_TASKS_PER_CHILD: "50"
      # Celery heartbeat and worker settings
      AIRFLOW__CELERY__WORKER_HEARTBEAT_SEC: "60"
      AIRFLOW__CELERY__BROKER_POOL_LIMIT: "10"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 3G
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  airflow-init:
    <<: *airflow-common
    build: ./airflow
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        echo "Airflow directories initialized successfully"
        timeout 120 /entrypoint airflow version || echo "Airflow version check timed out, but initialization proceeded"
        exit 0
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources
    networks:
      - fraud-detection

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    networks:
      - fraud-detection
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

# MINIO SERVER
  mc:
    image: minio/mc
    platform: linux/amd64
    depends_on:
      - minio
    container_name: mc
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c '
      echo "Waiting for MinIO to become ready...";
      i=0; until /usr/bin/mc alias set minio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY}; do i=$$((i+1)); echo retry $$i; sleep 2; done;
      /usr/bin/mc mb --ignore-existing minio/mlflow;
      exit 0;
      '
    networks:
      - fraud-detection

  minio:
    restart: always
    image: minio/minio
    platform: linux/amd64
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ':9001' --address ':9000'
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - minio_data:/data
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  #  MLFLOW SERVER
  mlflow-server:
    restart: always
    build:
      context: ..
      dockerfile: src/mlflow/Dockerfile
    image: fraud-detection/mlflow:latest
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Use the mlflow database created by init-multiple-dbs.sh
      # Default to mlflow database if DB_* vars not set, otherwise use provided vars
      - 'MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@postgres:${POSTGRES_PORT:-5432}/${MLFLOW_DB_NAME:-mlflow}?sslmode=${DB_SSLMODE:-prefer}'
      # Set artifact destination for S3-compatible storage
      - 'MLFLOW_ARTIFACTS_DESTINATION=s3://mlflow/fraud_detection'
      # Allow MLflow to bind to all interfaces
      - MLFLOW_SERVER_HOST=0.0.0.0
      # Set Flask/uvicorn SERVER_NAME to the service hostname so Host header validation can match
      - SERVER_NAME=mlflow-server
    # Use a robust startup script to initialize DB and start MLflow (avoids quoting/globbing issues)
    #command: ["/bin/bash", "/app/start-mlflow.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  inference:
    build:
      context: ..
      dockerfile: src/inference/Dockerfile
    image: fraud-detection/inference:latest
    container_name: inference-service
    env_file: .env
    environment:
      - INFERENCE_PORT=${INFERENCE_PORT:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - postgres
      - mlflow-server
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  fraudguard:
    profiles:
      - fraudguard
    build: ../fraudguard
    image: fraud-detection/fraudguard:latest
    container_name: fraudguard-web
    env_file: .env
    environment:
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL:-http://inference:8000}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow-server:5000}
      - AIRFLOW_WEBSERVER_URL=${AIRFLOW_WEBSERVER_URL:-http://airflow-webserver:8080}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
    ports:
      - "5000:5000"
    volumes:
      - ../fraudguard/data:/app/data
      - ../fraudguard/static:/app/static
      - ../fraudguard/templates:/app/templates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - inference
      - mlflow-server
      - airflow-webserver
    networks:
      - fraud-detection
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

volumes:
  postgres-db-volume:
  redis-data:
  minio_data:

networks:
  fraud-detection:
    driver: bridge
    driver_opts:
      # Enable IPv6 (helps with DNS resolution in some environments)
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        # Use standard Docker network range for better DNS resolution
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1