# Prometheus Configuration for MLOps Fraud Detection

global:
  scrape_interval: 15s       # Default scrape interval
  evaluation_interval: 15s   # Default evaluation interval
  external_labels:
    monitor: 'fraud-detection'
    environment: 'local'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Fraud Detection Inference API
  - job_name: 'inference'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['inference:8000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'inference'
    

  # Airflow Scheduler
  - job_name: 'airflow-scheduler'
    scrape_interval: 30s
    static_configs:
      - targets: ['airflow-scheduler:8793']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'airflow-scheduler'

  # PostgreSQL Exporter (optional, if postgres_exporter is deployed)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Redis Exporter (optional)
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'

  # MLflow (if metrics endpoint is exposed)
  - job_name: 'mlflow'
    scrape_interval: 30s
    static_configs:
      - targets: ['mlflow-server:5500']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlflow'
