mlflow:
  experiment_name: "fraud_detection"
  registered_model_name: "fraud_detection_model"
  tracking_uri: "http://mlflow-server:5500"
  artifact_location: "s3://mlflow/fraud_detection"
  s3_endpoint_url: "http://minio:9000"
  bucket: "mlflow"
  refresh_seconds: 28800

# API configuration for inference service (FRAUD_API_URL in env overrides)
api:
  url: "https://3consult-ng.com/fraud_api.php"
  max_batch_size: 10000
  max_records_per_run: 150000
  timeout_seconds: 60
  retries: 5
  backoff_factor: 2

model:
  test_size: 0.2
  seed: 42
  max_rows: 150000
  threshold: 0.5  # Classification threshold for inference (tuned based on F-beta score)
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 1
    tree_method: "hist"
  path: "/app/models/fraud_detection_model.pkl"




