name: Retrain demo model

# Retrains the offline demo model (`make demo`), checks a second run reproduces the same numbers,
# runs the tests against the new model, and commits reports/metrics.json and
# moniguard/models/offline_demo/ back to the branch that triggered it.

on:
  workflow_dispatch:
  push:
    branches: [retrain-demo]

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-demo.txt pytest pytest-cov httpx

      - name: Train (run 1, written to the repo)
        run: python scripts/offline_train_demo.py --n-transactions 60000 --days 180 --seed 42

      - name: Train (run 2, scratch copy)
        run: python scripts/offline_train_demo.py --n-transactions 60000 --days 180 --seed 42 --output-dir "$RUNNER_TEMP/run2"

      - name: Both runs must give the same numbers
        run: |
          python - "$RUNNER_TEMP/run2/reports/metrics.json" <<'PY'
          import json, math, sys
          a = json.load(open("reports/metrics.json"))
          b = json.load(open(sys.argv[1]))
          # Timing fields depend on the machine's load, not on the data or model.
          for m in (a, b):
              m.pop("generated_at"); m["run"].pop("elapsed_seconds"); m["metrics"].pop("p95_scoring_latency_ms")
          def walk(x, y, path="$"):
              if isinstance(x, dict):
                  for k in x: walk(x[k], y[k], f"{path}.{k}")
              elif isinstance(x, list):
                  for i, (p, q) in enumerate(zip(x, y)): walk(p, q, f"{path}[{i}]")
              elif isinstance(x, float):
                  if not math.isclose(x, y, rel_tol=1e-9, abs_tol=1e-12):
                      print(f"::error::not reproducible: {path} {x} vs {y}"); sys.exit(1)
              elif x != y:
                  print(f"::error::not reproducible: {path} {x!r} vs {y!r}"); sys.exit(1)
          walk(a, b)
          m = a["metrics"]
          print(f"::notice::reproducible. PR-AUC {m['pr_auc']['value']:.4f} CI {m['pr_auc']['ci95']}, "
                f"ROC-AUC {m['roc_auc']['value']:.4f} CI {m['roc_auc']['ci95']}, "
                f"recall@1% {m['recall_at_1pct_alert_rate']:.4f}, recall@5% {m['recall_at_5pct_alert_rate']:.4f}, "
                f"fraud rate {a['dataset']['fraud_rate_overall']:.4f}, features {a['model']['n_features']}")
          PY

      - name: Tests against the new model
        run: python3 -m pytest tests/ -q

      - name: Commit the new model and metrics
        run: |
          python -c "import json;m=json.load(open('reports/metrics.json'));print('::notice::p95 latency', round(m['metrics']['p95_scoring_latency_ms'],1), 'ms')"
          git config user.name ikebude
          git config user.email precious.ikebude@outlook.com
          git add reports/metrics.json moniguard/models/offline_demo
          git commit -m "chore(model): retrain the offline demo model with the seeded generator

          Same seed and anchor date now reproduce identical data, so these numbers can be
          regenerated by anyone with make demo. Also fixes the committed model, which predated
          iso_min/iso_max in feature_columns.json and could not be loaded."
          git push origin HEAD:${GITHUB_REF_NAME}
