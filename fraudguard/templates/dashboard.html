{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
        <div class="flex justify-between items-start mb-4">
            <div>
                <p class="text-sm text-gray-500 mb-1">Total Transactions</p>
                <h3 class="text-2xl font-bold text-gray-900" id="total-txn">—</h3>
            </div>
            <div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i class="ph ph-arrows-left-right text-xl"></i></div>
        </div>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
        <div class="flex justify-between items-start mb-4">
            <div>
                <p class="text-sm text-gray-500 mb-1">Fraud Rate</p>
                <h3 class="text-2xl font-bold text-gray-900" id="fraud-rate">—</h3>
            </div>
            <div class="p-2 bg-orange-50 text-orange-600 rounded-lg"><i class="ph ph-warning-circle text-xl"></i></div>
        </div>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
        <div class="flex justify-between items-start mb-4">
            <div>
                <p class="text-sm text-gray-500 mb-1">Approval Rate</p>
                <h3 class="text-2xl font-bold text-gray-900" id="approval-rate">—</h3>
            </div>
            <div class="p-2 bg-green-50 text-green-600 rounded-lg"><i class="ph ph-check-circle text-xl"></i></div>
        </div>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
        <div class="flex justify-between items-start mb-4">
            <div>
                <p class="text-sm text-gray-500 mb-1">Fraud Detections</p>
                <h3 class="text-2xl font-bold text-gray-900" id="active-alerts">—</h3>
            </div>
            <div class="p-2 bg-red-50 text-red-600 rounded-lg"><i class="ph ph-bell text-xl"></i></div>
        </div>
    </div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold text-gray-900 mb-6">Transaction Volume & Fraud</h3>
        <div class="h-64"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold text-gray-900 mb-6">Model Health</h3>
        <div class="space-y-4">
            <div class="flex justify-between"><span class="text-sm text-gray-500">Model</span><span class="text-sm font-medium" id="model-name">—</span></div>
            <div class="flex justify-between"><span class="text-sm text-gray-500">Version</span><span class="text-sm font-medium" id="model-version">—</span></div>
            <div class="flex justify-between"><span class="text-sm text-gray-500">Drift</span><span class="text-sm font-medium" id="drift-status">—</span></div>
        </div>
    </div>
</div>
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-900">Latest Transactions</h3>
        <a href="/transactions" class="text-sm text-orange-600 hover:text-orange-700 font-medium">View All</a>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                <tr>
                    <th class="px-6 py-3 font-medium">Time</th>
                    <th class="px-6 py-3 font-medium">ID</th>
                    <th class="px-6 py-3 font-medium">User</th>
                    <th class="px-6 py-3 font-medium">Amount</th>
                    <th class="px-6 py-3 font-medium">Risk</th>
                    <th class="px-6 py-3 font-medium">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 text-sm" id="txn-table-body"></tbody>
        </table>
    </div>
</div>
{% endblock %}
