{% extends "base.html" %}
{% block content %}
<style>
  .live-badge { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
  .status-ok { background: rgba(34, 197, 94, 0.1); color: #16a34a; }
  .status-down { background: rgba(220, 38, 38, 0.1); color: #dc2626; }
</style>
<div class="mb-8">
  <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2">
        <h3 class="text-xl font-semibold text-gray-900">System Health</h3>
        <span class="live-badge" title="Live monitoring"></span>
      </div>
      <button id="refresh-health-btn" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-sm font-medium transition">🔄 Refresh</button>
    </div>
    <div class="text-xs text-gray-500 mb-6">Last update: <span id="health-update-time">—</span></div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="services-grid"></div>
  </div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Model Health</h3>
    <div class="space-y-3" id="model-health-container">
      <div class="text-gray-500">Loading…</div>
    </div>
  </div>
  <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Quick Links</h3>
    <ul class="space-y-2 text-sm">
      <li><a href="http://localhost:5000" target="_blank" rel="noopener" class="text-orange-600 hover:underline">🛡️ FraudGuard</a> — 5000</li>
      <li><a href="http://localhost:8000" target="_blank" rel="noopener" class="text-orange-600 hover:underline">🔬 Inference API</a> — 8000</li>
      <li><a href="http://localhost:8080" target="_blank" rel="noopener" class="text-orange-600 hover:underline">🔄 Airflow</a> — 8080</li>
      <li><a href="http://localhost:5500" target="_blank" rel="noopener" class="text-orange-600 hover:underline">📊 MLflow</a> — 5500</li>
      <li><a href="http://localhost:9001" target="_blank" rel="noopener" class="text-orange-600 hover:underline">🪣 MinIO Console</a> — 9001</li>
      <li><a href="http://localhost:5555" target="_blank" rel="noopener" class="text-orange-600 hover:underline">🌼 Flower</a> — 5555</li>
    </ul>
  </div>
</div>
<script>
(function () {
  const config = { pollInterval: 5000 };
  
  function load() {
    fetch('/api/data').then(r => r.json()).then(d => {
      const m = (d.metrics || {});
      const mh = (d.model_health || {});
      
      const services = [
        { k: 'inference_status', l: '🔬 Inference API' },
        { k: 'mlflow_status', l: '📊 MLflow' },
        { k: 'airflow_status', l: '🔄 Airflow' },
        { k: 'minio_status', l: '🪣 MinIO' },
        { k: 'flower_status', l: '🌼 Flower' }
      ];
      
      const servicesHtml = services.map(s => {
        const ok = m[s.k] === 'ok';
        return `<div class="bg-gray-50 p-4 rounded-lg border ${ok ? 'border-green-200' : 'border-red-200'}"><div class="flex justify-between items-center"><span class="font-medium text-gray-900">${s.l}</span><span class="status-badge ${ok ? 'status-ok' : 'status-down'}">${ok ? '✓ OK' : '✗ DOWN'}</span></div><p class="text-xs text-gray-600 mt-2">${ok ? 'Service is healthy' : 'Service is unreachable'}</p></div>`;
      }).join('');
      
      document.getElementById('services-grid').innerHTML = servicesHtml;
      document.getElementById('health-update-time').textContent = new Date().toLocaleTimeString();
      
      const modelHtml = `
        <div class="border-b pb-3 mb-3"><p class="text-xs text-gray-500">Model Name</p><p class="font-semibold text-gray-900">${mh.name || '—'}</p></div>
        <div class="border-b pb-3 mb-3"><p class="text-xs text-gray-500">Version</p><p class="font-semibold text-gray-900">${mh.version || '—'}</p></div>
        <div class="border-b pb-3 mb-3"><p class="text-xs text-gray-500">Last Retrained</p><p class="font-semibold text-gray-900">${mh.last_retrained || '—'}</p></div>
        <div><p class="text-xs text-gray-500">Drift Status</p><p class="font-semibold text-green-600">${mh.drift_status || 'Normal'}</p></div>
      `;
      document.getElementById('model-health-container').innerHTML = modelHtml;
    }).catch(() => {
      document.getElementById('services-grid').innerHTML = '<div class="col-span-full text-center text-gray-500">Could not load status</div>';
    });
  }
  
  load();
  setInterval(load, config.pollInterval);
  document.getElementById('refresh-health-btn').addEventListener('click', load);
})();
</script>
{% endblock %}
