<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alerts - FraudGuard Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-effect { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .alert-critical { border-left: 4px solid #dc2626; background: rgba(220, 38, 38, 0.1); }
        .alert-high { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
        .alert-medium { border-left: 4px solid #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .alert-low { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.1); }
        .pulse-alert { animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-gray-100 min-h-screen">
    
    <!-- Navigation -->
    <nav class="glass-effect border-b border-white/10 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="shield-alert" class="w-8 h-8 text-red-400"></i>
                        <h1 class="text-xl font-bold text-white">Security Alerts</h1>
                    </div>
                    <span class="px-3 py-1 bg-red-500/20 text-red-400 rounded-full text-sm" id="alert-count">0 Active</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="refreshAlerts()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors flex items-center space-x-2">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span>Refresh</span>
                    </button>
                    <a href="/" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded-lg transition-colors">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Alert Filters -->
        <div class="glass-effect rounded-xl p-6 mb-8">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-400">Severity:</label>
                    <select id="severity-filter" class="px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white text-sm">
                        <option value="">All Severities</option>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-400">Status:</label>
                    <select id="status-filter" class="px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white text-sm">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="investigating">Investigating</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-400">Time Range:</label>
                    <select id="time-filter" class="px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white text-sm">
                        <option value="1h">Last Hour</option>
                        <option value="24h" selected>Last 24 Hours</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="30d">Last 30 Days</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Alert Statistics -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="alert-circle" class="w-8 h-8 text-red-400"></i>
                    <span class="text-2xl font-bold text-white" id="critical-count">0</span>
                </div>
                <div class="text-sm text-gray-400">Critical Alerts</div>
            </div>
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-orange-400"></i>
                    <span class="text-2xl font-bold text-white" id="high-count">0</span>
                </div>
                <div class="text-sm text-gray-400">High Priority</div>
            </div>
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="info" class="w-8 h-8 text-yellow-400"></i>
                    <span class="text-2xl font-bold text-white" id="medium-count">0</span>
                </div>
                <div class="text-sm text-gray-400">Medium Priority</div>
            </div>
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="check-circle" class="w-8 h-8 text-green-400"></i>
                    <span class="text-2xl font-bold text-white" id="resolved-count">0</span>
                </div>
                <div class="text-sm text-gray-400">Resolved Today</div>
            </div>
        </div>

        <!-- Alerts List -->
        <div class="space-y-4" id="alerts-container">
            <!-- Alerts will be loaded here dynamically -->
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Sample alerts data - in production this would come from the API
        const sampleAlerts = [
            {
                id: 'ALERT-2024-001',
                title: 'Multiple High-Value Fraud Attempts Detected',
                description: '12 fraud attempts detected on transactions exceeding $10,000 within the last 15 minutes. Pattern suggests coordinated attack from multiple IP addresses.',
                severity: 'critical',
                status: 'active',
                timestamp: '2 minutes ago',
                source: 'System',
                pulse: true
            },
            {
                id: 'ALERT-2024-002',
                title: 'Unusual Transaction Volume Spike',
                description: 'Transaction volume increased by 300% compared to baseline for user ID: user_78234. Possible account takeover or automated fraud.',
                severity: 'high',
                status: 'active',
                timestamp: '15 minutes ago',
                source: 'System',
                pulse: false
            },
            {
                id: 'ALERT-2024-003',
                title: 'Model Performance Drift Detected',
                description: 'Model precision has decreased by 5% over the last 24 hours. Consider retraining with recent data.',
                severity: 'medium',
                status: 'investigating',
                timestamp: '1 hour ago',
                source: 'ML Team',
                pulse: false
            }
        ];

        // Initialize alerts
        document.addEventListener('DOMContentLoaded', function() {
            loadAlerts();
            updateStatistics();
            setupEventListeners();
        });

        function loadAlerts() {
            const container = document.getElementById('alerts-container');
            container.innerHTML = '';

            sampleAlerts.forEach(alert => {
                const alertElement = createAlertElement(alert);
                container.appendChild(alertElement);
            });
        }

        function createAlertElement(alert) {
            const div = document.createElement('div');
            div.className = `glass-effect rounded-xl p-6 alert-${alert.severity} ${alert.pulse ? 'pulse-alert' : ''}`;
            div.innerHTML = `
                <div class="flex items-start justify-between">
                    <div class="flex items-start space-x-4">
                        <i data-lucide="${getSeverityIcon(alert.severity)}" class="w-6 h-6 text-${getSeverityColor(alert.severity)} mt-1"></i>
                        <div class="flex-1">
                            <div class="flex items-center space-x-3 mb-2">
                                <h3 class="text-lg font-semibold text-white">${alert.title}</h3>
                                <span class="px-2 py-1 bg-${getSeverityColor(alert.severity)}/20 text-${getSeverityColor(alert.severity)} rounded text-xs">${alert.severity.toUpperCase()}</span>
                                <span class="px-2 py-1 bg-${getStatusColor(alert.status)}/20 text-${getStatusColor(alert.status)} rounded text-xs">${alert.status.toUpperCase()}</span>
                            </div>
                            <p class="text-gray-300 mb-3">${alert.description}</p>
                            <div class="flex items-center space-x-6 text-sm text-gray-400">
                                <span><i data-lucide="clock" class="w-4 h-4 inline mr-1"></i>${alert.timestamp}</span>
                                <span><i data-lucide="user" class="w-4 h-4 inline mr-1"></i>${alert.source}</span>
                                <span><i data-lucide="hash" class="w-4 h-4 inline mr-1"></i>#${alert.id}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="investigateAlert('${alert.id}')" class="px-3 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors text-sm">Investigate</button>
                        <button onclick="resolveAlert('${alert.id}')" class="px-3 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-colors text-sm">Resolve</button>
                    </div>
                </div>
            `;
            return div;
        }

        function getSeverityIcon(severity) {
            switch (severity) {
                case 'critical': return 'alert-circle';
                case 'high': return 'alert-triangle';
                case 'medium': return 'info';
                case 'low': return 'check-circle';
                default: return 'info';
            }
        }

        function getSeverityColor(severity) {
            switch (severity) {
                case 'critical': return 'red-400';
                case 'high': return 'orange-400';
                case 'medium': return 'yellow-400';
                case 'low': return 'green-400';
                default: return 'gray-400';
            }
        }

        function getStatusColor(status) {
            switch (status) {
                case 'active': return 'blue-400';
                case 'investigating': return 'purple-400';
                case 'resolved': return 'green-400';
                default: return 'gray-400';
            }
        }

        function updateStatistics() {
            const criticalCount = sampleAlerts.filter(a => a.severity === 'critical').length;
            const highCount = sampleAlerts.filter(a => a.severity === 'high').length;
            const mediumCount = sampleAlerts.filter(a => a.severity === 'medium').length;
            const resolvedCount = 3; // Sample resolved count

            document.getElementById('critical-count').textContent = criticalCount;
            document.getElementById('high-count').textContent = highCount;
            document.getElementById('medium-count').textContent = mediumCount;
            document.getElementById('resolved-count').textContent = resolvedCount;
            document.getElementById('alert-count').textContent = `${sampleAlerts.length} Active`;

            // Re-initialize icons for dynamically added content
            lucide.createIcons();
        }

        function setupEventListeners() {
            document.getElementById('severity-filter').addEventListener('change', filterAlerts);
            document.getElementById('status-filter').addEventListener('change', filterAlerts);
            document.getElementById('time-filter').addEventListener('change', filterAlerts);
        }

        function filterAlerts() {
            const severity = document.getElementById('severity-filter').value;
            const status = document.getElementById('status-filter').value;
            const timeRange = document.getElementById('time-filter').value;
            
            console.log('Filtering alerts:', { severity, status, timeRange });
            // Implement filtering logic here
        }

        function refreshAlerts() {
            console.log('Refreshing alerts...');
            loadAlerts();
        }

        function investigateAlert(alertId) {
            console.log('Investigating alert:', alertId);
            // Open investigation modal or navigate to investigation page
        }

        function resolveAlert(alertId) {
            console.log('Resolving alert:', alertId);
            // Mark alert as resolved and update UI
        }
    </script>
</body>
</html>
