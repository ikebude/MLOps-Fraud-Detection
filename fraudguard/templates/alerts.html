{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Summary + Filters -->
    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
        <div class="flex items-center gap-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Total Alerts</p>
                <h3 id="total-alerts" class="text-2xl font-bold">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Critical</p>
                <h3 id="total-critical" class="text-2xl font-bold text-red-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">High</p>
                <h3 id="total-high" class="text-2xl font-bold text-orange-600">0</h3>
            </div>
        </div>

        <div class="flex flex-wrap gap-3 items-center">
            <select id="filter-severity" class="px-3 py-2 border rounded-lg w-full sm:w-auto">
                <option value="">All Severities</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <select id="filter-status" class="px-3 py-2 border rounded-lg w-full sm:w-auto">
                <option value="">All Statuses</option>
                <option value="New">New</option>
                <option value="Under Review">Under Review</option>
                <option value="Escalated">Escalated</option>
                <option value="Confirmed Fraud">Confirmed Fraud</option>
                <option value="False Positive">False Positive</option>
                <option value="Closed">Closed</option>
            </select>

            <select id="filter-fraudtype" class="px-3 py-2 border rounded-lg w-full sm:w-auto">
                <option value="">All Fraud Types</option>
                <option value="location_mismatch">Location Mismatch</option>
                <option value="amount_anomaly">Amount Anomaly</option>
                <option value="velocity">Velocity</option>
            </select>

            <input id="filter-start" type="date" class="px-3 py-2 border rounded-lg w-full sm:w-auto" />
            <input id="filter-end" type="date" class="px-3 py-2 border rounded-lg w-full sm:w-auto" />

            <input id="filter-minrisk" type="number" min="0" max="100" placeholder="min risk" class="px-3 py-2 border rounded-lg w-full sm:w-24" />
            <input id="filter-maxrisk" type="number" min="0" max="100" placeholder="max risk" class="px-3 py-2 border rounded-lg w-full sm:w-24" />

            <button id="apply-filters" class="px-4 py-2 bg-brand-orange text-white rounded-lg w-full sm:w-auto">Apply</button>
            <button id="view-table" class="px-4 py-2 border rounded-lg w-full sm:w-auto">Table View</button>
        </div>
    </div>

    <!-- Card/List and Table Toggle -->
    <div id="alerts-container" class="space-y-4">
        <div id="alerts-list" class="grid gap-4"></div>

        <div id="alerts-table-wrapper" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <table id="alerts-table" class="w-full text-sm">
                <thead>
                    <tr class="text-left">
                        <th class="p-2">Alert ID</th>
                        <th class="p-2">Txn ID</th>
                        <th class="p-2">Customer</th>
                        <th class="p-2">Amount</th>
                        <th class="p-2">Risk Score</th>
                        <th class="p-2">Severity</th>
                        <th class="p-2">Status</th>
                        <th class="p-2">Analyst</th>
                        <th class="p-2">Time</th>
                        <th class="p-2">Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl p-6">
            <div class="flex justify-between items-start">
                <div>
                    <h3 id="modal-title" class="text-xl font-bold">Alert Details</h3>
                    <p id="modal-sub" class="text-sm text-gray-500">Details and transaction history</p>
                </div>
                <button onclick="closeModal()" class="text-gray-500">Close</button>
            </div>
            <div id="modal-body" class="mt-4 text-sm text-gray-700"></div>
            <div class="mt-4 flex gap-2 justify-end">
                <button id="modal-fraud" class="px-4 py-2 bg-red-600 text-white rounded">Mark as Fraud</button>
                <button id="modal-safe" class="px-4 py-2 border rounded">Mark as Safe</button>
                <button id="modal-escalate" class="px-4 py-2 bg-gray-900 text-white rounded">Investigate</button>
            </div>
        </div>
    </div>
</div>

<script id="users-data" type="application/json">{{ USERS | tojson }}</script>

<script>
    const USERS = Object.keys(JSON.parse(document.getElementById('users-data').textContent || '{}'));

    function severityBadge(sev){
        const map = { critical: '🔴 Critical', high: '🟠 High', medium: '🟡 Medium', low: '🟢 Low' };
        return map[sev] || sev;
    }

    function renderAlertCard(a){
        return `
        <div class="bg-white p-6 rounded-xl shadow-sm border ${a.severity=='critical'? 'border-l-4 border-red-500' : a.severity=='high'? 'border-l-4 border-orange-500' : 'border-gray-100'}">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h3 class="text-lg font-bold text-gray-900 mb-1">${severityBadge(a.severity)} — ${a.reason}</h3>
                    <div class="text-sm text-gray-600">Risk Score: <strong>${a.risk_score}/100</strong> &nbsp; • &nbsp; Fraud Prob: <strong>${a.fraud_probability.toFixed(2)}</strong></div>
                </div>
                <div class="text-sm text-gray-500">${new Date(a.created_at).toLocaleString()}</div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="text-sm text-gray-700">
                    <div><strong>Transaction ID:</strong> ${a.transaction.transaction_id}</div>
                    <div><strong>Customer:</strong> ${a.transaction.customer_id}</div>
                    <div><strong>Amount:</strong> $${a.transaction.amount.toLocaleString()}</div>
                    <div><strong>Merchant:</strong> ${a.transaction.merchant}</div>
                </div>
                <div class="text-sm text-gray-700">
                    <div><strong>Channel:</strong> ${a.transaction.channel}</div>
                    <div><strong>Location:</strong> ${a.transaction.location}</div>
                    <div><strong>Device ID:</strong> ${a.transaction.device_id}</div>
                    <div><strong>Previous Login:</strong> ${a.transaction.previous_login || '—'}</div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="text-sm"><strong>Status:</strong> <span id="status-${a.id}">${a.status}</span></div>
                    <div>
                        <label class="text-sm">Assigned to:</label>
                        <select id="assign-${a.id}" class="ml-2 px-2 py-1 border rounded">
                            <option value="">Unassigned</option>
                            ${USERS.map(u=>`<option value="${u}" ${a.assigned_to==u? 'selected':''}>${u}</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button class="px-3 py-1 bg-gray-900 text-white rounded" onclick="takeAction('${a.id}','Under Review')">Investigate</button>
                    <button class="px-3 py-1 bg-red-600 text-white rounded" onclick="takeAction('${a.id}','Confirmed Fraud')">Mark as Fraud</button>
                    <button class="px-3 py-1 border border-gray-300 rounded" onclick="takeAction('${a.id}','False Positive')">Mark as Safe</button>
                    <button class="px-3 py-1 border border-gray-300 rounded ml-2" onclick="showAlertDetails('${a.id}')">Details</button>
                </div>
            </div>
        </div>`;
    }

    function renderAlertsTableRows(alerts){
        return alerts.map(a=>{
            return `
            <tr class="border-t">
                <td class="p-2" data-label="Alert ID">${a.id}</td>
                <td class="p-2" data-label="Txn ID">${a.transaction.transaction_id}</td>
                <td class="p-2" data-label="Customer">${a.transaction.customer_id}</td>
                <td class="p-2" data-label="Amount">$${a.transaction.amount.toLocaleString()}</td>
                <td class="p-2" data-label="Risk Score">${a.risk_score}/100</td>
                <td class="p-2" data-label="Severity">${a.severity}</td>
                <td class="p-2" data-label="Status">${a.status}</td>
                <td class="p-2" data-label="Analyst">${a.assigned_to || 'Unassigned'}</td>
                <td class="p-2" data-label="Time">${new Date(a.created_at).toLocaleString()}</td>
                <td class="p-2" data-label="Action"><button class="px-2 py-1 border rounded" onclick="showAlertDetails('${a.id}')">Open</button></td>
            </tr>`;
        }).join('');
    }

    async function loadAlerts(){
        const severity = document.getElementById('filter-severity').value;
        const status = document.getElementById('filter-status').value;
        const assigned = document.getElementById('filter-assigned') ? document.getElementById('filter-assigned').value : '';
        const fraudType = document.getElementById('filter-fraudtype').value;
        const start = document.getElementById('filter-start').value;
        const end = document.getElementById('filter-end').value;
        const minr = document.getElementById('filter-minrisk').value;
        const maxr = document.getElementById('filter-maxrisk').value;

        const params = new URLSearchParams();
        if(severity) params.set('severity', severity);
        if(status) params.set('status', status);
        if(assigned && assigned!=='Unassigned') params.set('assigned', assigned);
        if(fraudType) params.set('fraud_type', fraudType);
        if(start) params.set('start_date', start);
        if(end) params.set('end_date', end);
        if(minr) params.set('min_risk', minr);
        if(maxr) params.set('max_risk', maxr);

        const res = await fetch('/api/alerts' + (params.toString()?('?'+params.toString()):''));
        const alerts = await res.json();

        // Summary
        document.getElementById('total-alerts').textContent = alerts.length;
        const bySev = {critical:0, high:0, medium:0, low:0};
        alerts.forEach(a=> bySev[a.severity] = (bySev[a.severity]||0)+1);
        document.getElementById('total-critical').textContent = bySev.critical||0;
        document.getElementById('total-high').textContent = bySev.high||0;

        // Fill assigned filter options
        const assignSelect = document.getElementById('filter-assigned');
        if(assignSelect){
            const existing = Array.from(assignSelect.options).map(o=>o.value);
            const assignees = Array.from(new Set(alerts.map(a=>a.assigned_to).filter(Boolean)));
            assignees.forEach(name=>{ if(!existing.includes(name)) assignSelect.add(new Option(name, name)); });
        }

        // Render cards
        const container = document.getElementById('alerts-list');
        container.innerHTML = alerts.map(renderAlertCard).join('');

        // Render table rows
        const tbody = document.querySelector('#alerts-table tbody');
        if(tbody) tbody.innerHTML = renderAlertsTableRows(alerts);

        // Wire up assignment change events
        alerts.forEach(a=>{
            const sel = document.getElementById('assign-'+a.id);
            if(sel) sel.addEventListener('change', () => updateAssignment(a.id, sel.value));
        });
    }

    async function showAlertDetails(id){
        const res = await fetch('/api/alerts/'+id);
        if(!res.ok) return alert('Alert not found');
        const a = await res.json();
        document.getElementById('modal-title').textContent = `${severityBadge(a.severity)} — ${a.reason}`;
        document.getElementById('modal-sub').textContent = `Alert ${a.id} • ${new Date(a.created_at).toLocaleString()}`;
        document.getElementById('modal-body').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <p><strong>Transaction ID:</strong> ${a.transaction.transaction_id}</p>
                    <p><strong>Customer ID:</strong> ${a.transaction.customer_id}</p>
                    <p><strong>Amount:</strong> $${a.transaction.amount.toLocaleString()}</p>
                    <p><strong>Merchant:</strong> ${a.transaction.merchant}</p>
                    <p><strong>Channel:</strong> ${a.transaction.channel}</p>
                    <p><strong>Location:</strong> ${a.transaction.location}</p>
                    <p><strong>Device ID:</strong> ${a.transaction.device_id}</p>
                </div>
                <div>
                    <p><strong>Risk Score:</strong> ${a.risk_score}/100</p>
                    <p><strong>Fraud Probability:</strong> ${a.fraud_probability.toFixed(2)}</p>
                    <p><strong>Status:</strong> ${a.status}</p>
                    <p><strong>Assigned to:</strong> ${a.assigned_to || 'Unassigned'}</p>
                    <p><strong>Reason:</strong> ${a.reason}</p>
                </div>
            </div>
            <hr class="my-3" />
            <div>
                <h4 class="font-medium mb-2">Transaction History (sample)</h4>
                <p class="text-xs text-gray-500">Recent txn behavior and customer pattern would appear here. Use your backend to fetch real history.</p>
            </div>
        `;

        // wire modal action buttons
        document.getElementById('modal-fraud').onclick = ()=>{ takeAction(id, 'Confirmed Fraud'); closeModal(); };
        document.getElementById('modal-safe').onclick = ()=>{ takeAction(id, 'False Positive'); closeModal(); };
        document.getElementById('modal-escalate').onclick = ()=>{ takeAction(id, 'Escalated'); closeModal(); };

        document.getElementById('alert-modal').classList.remove('hidden');
        document.getElementById('alert-modal').classList.add('flex');
    }

    function closeModal(){
        document.getElementById('alert-modal').classList.add('hidden');
        document.getElementById('alert-modal').classList.remove('flex');
        loadAlerts();
    }

    async function updateAssignment(id, assignee){
        await fetch('/api/alerts/'+id, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({assigned_to: assignee || null})});
        loadAlerts();
    }

    async function takeAction(id, status){
        await fetch('/api/alerts/'+id, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status})});
        loadAlerts();
    }

    document.getElementById('apply-filters').addEventListener('click', loadAlerts);
    document.getElementById('view-table').addEventListener('click', ()=>{
        document.getElementById('alerts-list').classList.toggle('hidden');
        document.getElementById('alerts-table-wrapper').classList.toggle('hidden');
    });
    document.addEventListener('DOMContentLoaded', loadAlerts);
</script>

{% endblock %}
