{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Summary + Filters -->
    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
        <div class="flex items-center gap-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Total Alerts</p>
                <h3 id="total-alerts" class="text-2xl font-bold">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Critical</p>
                <h3 id="total-critical" class="text-2xl font-bold text-red-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">High</p>
                <h3 id="total-high" class="text-2xl font-bold text-orange-600">0</h3>
            </div>
        </div>

        <div class="flex flex-wrap gap-3 items-center">
            <select id="filter-severity" class="px-3 py-2 border rounded-lg w-full sm:w-auto">
                <option value="">All Severities</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <select id="filter-status" class="px-3 py-2 border rounded-lg w-full sm:w-auto">
                <option value="">All Statuses</option>
                <option value="New">New</option>
                <option value="Under Review">Under Review</option>
                <option value="Escalated">Escalated</option>
                <option value="Confirmed Fraud">Confirmed Fraud</option>
                <option value="False Positive">False Positive</option>
                <option value="Closed">Closed</option>
            </select>

            <select id="filter-fraudtype" class="px-3 py-2 border rounded-lg w-full sm:w-auto">
                <option value="">All Fraud Types</option>
                <option value="location_mismatch">Location Mismatch</option>
                <option value="amount_anomaly">Amount Anomaly</option>
                <option value="velocity">Velocity</option>
            </select>

            <input id="filter-start" type="date" class="px-3 py-2 border rounded-lg w-full sm:w-auto" />
            <input id="filter-end" type="date" class="px-3 py-2 border rounded-lg w-full sm:w-auto" />

            <input id="filter-minrisk" type="number" min="0" max="100" placeholder="min risk"
                class="px-3 py-2 border rounded-lg w-full sm:w-24" />
            <input id="filter-maxrisk" type="number" min="0" max="100" placeholder="max risk"
                class="px-3 py-2 border rounded-lg w-full sm:w-24" />

            <button id="apply-filters"
                class="px-4 py-2 bg-orange-500 text-white rounded-lg w-full sm:w-auto hover:bg-orange-600 transition-colors">Apply</button>
            <button id="view-table"
                class="px-4 py-2 border rounded-lg w-full sm:w-auto hover:bg-gray-50 transition-colors">Table
                View</button>
        </div>
    </div>

    <!-- Card/List and Table Toggle -->
    <div id="alerts-container" class="space-y-4">
        <div id="alerts-list" class="grid gap-4"></div>

        <div id="alerts-table-wrapper"
            class="hidden bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col max-h-[600px]">
            <div class="overflow-y-auto custom-scrollbar p-4">
                <table id="alerts-table" class="w-full text-sm relative">
                    <thead class="sticky top-0 z-10 bg-white shadow-sm">
                        <tr class="text-left bg-gray-50/50">
                            <th class="p-2 py-3 font-semibold text-gray-600">Alert ID</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Txn ID</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Customer</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Amount</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Risk Score</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Severity</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Status</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Analyst</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Time</th>
                            <th class="p-2 py-3 font-semibold text-gray-600">Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- No alerts state -->
        <div id="no-alerts"
            class="hidden flex flex-col items-center justify-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
            <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mb-4">
                <i class="ph ph-shield-check text-3xl text-green-500"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">System Secure</h3>
            <p class="text-gray-500">No active threats detected at this moment.</p>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl p-6">
            <div class="flex justify-between items-start">
                <div>
                    <h3 id="modal-title" class="text-xl font-bold">Alert Details</h3>
                    <p id="modal-sub" class="text-sm text-gray-500">Details and transaction history</p>
                </div>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-lg">&times;</button>
            </div>
            <div id="modal-body" class="mt-4 text-sm text-gray-700"></div>
            <div class="mt-4 flex gap-2 justify-end">
                <button id="modal-fraud"
                    class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-colors">Mark as
                    Fraud</button>
                <button id="modal-safe" class="px-4 py-2 border rounded hover:bg-gray-50 transition-colors">Mark as
                    Safe</button>
                <button id="modal-escalate"
                    class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition-colors">Investigate</button>
            </div>
        </div>
    </div>
</div>

<script id="users-data" type="application/json">{{ USERS | tojson }}</script>

<script>
    const basePath = window.FRAUDGUARD_BASE_PATH || '';
    const USERS = Object.keys(JSON.parse(document.getElementById('users-data').textContent || '{}'));

    function severityBadge(sev) {
        const map = { critical: '🔴 Critical', high: '🟠 High', medium: '🟡 Medium', low: '🟢 Low' };
        return map[sev] || sev;
    }

    function renderAlertCard(a) {
        return `
        <div class="bg-white p-6 rounded-xl shadow-sm border ${a.severity == 'critical' ? 'border-l-4 border-red-500' : a.severity == 'high' ? 'border-l-4 border-orange-500' : 'border-gray-100'} hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h3 class="text-lg font-bold text-gray-900 mb-1">${severityBadge(a.severity)} — ${a.reason}</h3>
                    <div class="text-sm text-gray-600">Risk Score: <strong>${a.risk_score}/100</strong> &nbsp; • &nbsp; Fraud Prob: <strong>${(a.fraud_probability * 100).toFixed(1)}%</strong></div>
                </div>
                <div class="text-sm text-gray-500">${new Date(a.created_at).toLocaleString()}</div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="text-sm text-gray-700">
                    <div><strong>Transaction ID:</strong> ${a.transaction.transaction_id}</div>
                    <div><strong>Customer:</strong> ${a.transaction.customer_id}</div>
                    <div><strong>Amount:</strong> ₦${parseFloat(a.transaction.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</div>
                    <div><strong>Merchant:</strong> ${a.transaction.merchant}</div>
                </div>
                <div class="text-sm text-gray-700">
                    <div><strong>Channel:</strong> ${a.transaction.channel}</div>
                    <div><strong>Location:</strong> ${a.transaction.location}</div>
                    <div><strong>Device ID:</strong> ${a.transaction.device_id}</div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="text-sm"><strong>Status:</strong> <span id="status-${a.id}">${a.status}</span></div>
                    <div>
                        <label class="text-sm">Assigned to:</label>
                        <select id="assign-${a.id}" class="ml-2 px-2 py-1 border rounded text-sm">
                            <option value="">Unassigned</option>
                            ${USERS.map(u => `<option value="${u}" ${a.assigned_to == u ? 'selected' : ''}>${u}</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button class="px-3 py-1 bg-gray-900 text-white rounded text-sm hover:bg-gray-800" onclick="takeAction('${a.id}','Under Review')">Investigate</button>
                    <button class="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700" onclick="takeAction('${a.id}','Confirmed Fraud')">Mark as Fraud</button>
                    <button class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50" onclick="takeAction('${a.id}','False Positive')">Mark as Safe</button>
                    <button class="px-3 py-1 border border-gray-300 rounded text-sm ml-2 hover:bg-gray-50" onclick="showAlertDetails('${a.id}')">Details</button>
                </div>
            </div>
        </div>`;
    }

    function renderAlertsTableRows(alerts) {
        return alerts.map(a => {
            return `
            <tr class="border-t hover:bg-gray-50">
                <td class="p-2" data-label="Alert ID">${a.id}</td>
                <td class="p-2" data-label="Txn ID">${a.transaction.transaction_id}</td>
                <td class="p-2" data-label="Customer">${a.transaction.customer_id}</td>
                <td class="p-2" data-label="Amount">₦${parseFloat(a.transaction.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                <td class="p-2" data-label="Risk Score">${a.risk_score}/100</td>
                <td class="p-2" data-label="Severity">${a.severity}</td>
                <td class="p-2" data-label="Status">${a.status}</td>
                <td class="p-2" data-label="Analyst">${a.assigned_to || 'Unassigned'}</td>
                <td class="p-2" data-label="Time">${new Date(a.created_at).toLocaleString()}</td>
                <td class="p-2" data-label="Action"><button class="px-2 py-1 border rounded hover:bg-gray-50" onclick="showAlertDetails('${a.id}')">Open</button></td>
            </tr>`;
        }).join('');
    }

    async function loadAlerts() {
        const severity = document.getElementById('filter-severity').value;
        const status = document.getElementById('filter-status').value;
        const fraudType = document.getElementById('filter-fraudtype').value;
        const start = document.getElementById('filter-start').value;
        const end = document.getElementById('filter-end').value;
        const minr = document.getElementById('filter-minrisk').value;
        const maxr = document.getElementById('filter-maxrisk').value;

        const params = new URLSearchParams();
        if (severity) params.set('severity', severity);
        if (status) params.set('status', status);
        if (fraudType) params.set('fraud_type', fraudType);
        if (start) params.set('start_date', start);
        if (end) params.set('end_date', end);
        if (minr) params.set('min_risk', minr);
        if (maxr) params.set('max_risk', maxr);

        try {
            const res = await fetch(basePath + '/api/alerts' + (params.toString() ? ('?' + params.toString()) : ''));
            const alerts = await res.json();

            // Summary
            document.getElementById('total-alerts').textContent = alerts.length;
            const bySev = { critical: 0, high: 0, medium: 0, low: 0 };
            alerts.forEach(a => bySev[a.severity] = (bySev[a.severity] || 0) + 1);
            document.getElementById('total-critical').textContent = bySev.critical || 0;
            document.getElementById('total-high').textContent = bySev.high || 0;

            // Show/hide no-alerts state
            const noAlerts = document.getElementById('no-alerts');
            const alertsList = document.getElementById('alerts-list');
            if (alerts.length === 0) {
                noAlerts.classList.remove('hidden');
                alertsList.classList.add('hidden');
            } else {
                noAlerts.classList.add('hidden');
                alertsList.classList.remove('hidden');
            }

            // Render cards
            alertsList.innerHTML = alerts.map(renderAlertCard).join('');

            // Render table rows
            const tbody = document.querySelector('#alerts-table tbody');
            if (tbody) tbody.innerHTML = renderAlertsTableRows(alerts);

            // Wire up assignment change events
            alerts.forEach(a => {
                const sel = document.getElementById('assign-' + a.id);
                if (sel) sel.addEventListener('change', () => updateAssignment(a.id, sel.value));
            });
        } catch (err) {
            console.error('Failed to load alerts:', err);
        }
    }

    async function showAlertDetails(id) {
        const res = await fetch(basePath + '/api/alerts/' + id);
        if (!res.ok) return alert('Alert not found');
        const a = await res.json();
        document.getElementById('modal-title').textContent = `${severityBadge(a.severity)} — ${a.reason}`;
        document.getElementById('modal-sub').textContent = `Alert ${a.id} • ${new Date(a.created_at).toLocaleString()}`;
        document.getElementById('modal-body').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <p><strong>Transaction ID:</strong> ${a.transaction.transaction_id}</p>
                    <p><strong>Customer ID:</strong> ${a.transaction.customer_id}</p>
                    <p><strong>Amount:</strong> ₦${parseFloat(a.transaction.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</p>
                    <p><strong>Merchant:</strong> ${a.transaction.merchant}</p>
                    <p><strong>Channel:</strong> ${a.transaction.channel}</p>
                    <p><strong>Location:</strong> ${a.transaction.location}</p>
                    <p><strong>Device ID:</strong> ${a.transaction.device_id}</p>
                </div>
                <div>
                    <p><strong>Risk Score:</strong> ${a.risk_score}/100</p>
                    <p><strong>Fraud Probability:</strong> ${(a.fraud_probability * 100).toFixed(1)}%</p>
                    <p><strong>Status:</strong> ${a.status}</p>
                    <p><strong>Assigned to:</strong> ${a.assigned_to || 'Unassigned'}</p>
                    <p><strong>Reason:</strong> ${a.reason}</p>
                </div>
            </div>
            <hr class="my-3" />
            <div>
                <h4 class="font-medium mb-2">Transaction History</h4>
                <p class="text-xs text-gray-500">Recent transaction behavior and customer patterns based on model analysis.</p>
            </div>
        `;

        // wire modal action buttons
        document.getElementById('modal-fraud').onclick = () => { takeAction(id, 'Confirmed Fraud'); closeModal(); };
        document.getElementById('modal-safe').onclick = () => { takeAction(id, 'False Positive'); closeModal(); };
        document.getElementById('modal-escalate').onclick = () => { takeAction(id, 'Escalated'); closeModal(); };

        document.getElementById('alert-modal').classList.remove('hidden');
        document.getElementById('alert-modal').classList.add('flex');
    }

    function closeModal() {
        document.getElementById('alert-modal').classList.add('hidden');
        document.getElementById('alert-modal').classList.remove('flex');
        loadAlerts();
    }

    async function updateAssignment(id, assignee) {
        await fetch(basePath + '/api/alerts/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ assigned_to: assignee || null }) });
        loadAlerts();
    }

    async function takeAction(id, status) {
        await fetch(basePath + '/api/alerts/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
        loadAlerts();
    }

    document.getElementById('apply-filters').addEventListener('click', loadAlerts);
    document.getElementById('view-table').addEventListener('click', () => {
        document.getElementById('alerts-list').classList.toggle('hidden');
        document.getElementById('alerts-table-wrapper').classList.toggle('hidden');
    });
    document.addEventListener('DOMContentLoaded', loadAlerts);
</script>

{% endblock %}
