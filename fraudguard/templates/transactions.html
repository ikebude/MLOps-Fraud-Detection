{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-900">All Transactions</h3>
        <div class="flex gap-2">
            <input type="text" placeholder="Search ID or Merchant..." class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
            <button class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">Filter</button>
        </div>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                <tr>
                    <th class="px-6 py-3 font-medium">Time</th>
                    <th class="px-6 py-3 font-medium">Transaction ID</th>
                    <th class="px-6 py-3 font-medium">Merchant</th>
                    <th class="px-6 py-3 font-medium">Amount</th>
                    <th class="px-6 py-3 font-medium">Risk Score</th>
                    <th class="px-6 py-3 font-medium">Status</th>
                    <th class="px-6 py-3 font-medium">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 text-sm" id="all-txn-table-body">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>
    <div class="px-6 py-4 border-t border-gray-200 flex justify-between items-center">
        <span class="text-sm text-gray-500" id="txn-count-display">Loading...</span>
        <div class="flex gap-2">
            <button id="btn-prev" class="px-3 py-1 border border-gray-300 rounded text-sm disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
            <button id="btn-next" class="px-3 py-1 border border-gray-300 rounded text-sm disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const basePath = window.FRAUDGUARD_BASE_PATH || '';
        const tbody = document.getElementById('all-txn-table-body');
        const countDisplay = document.getElementById('txn-count-display');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        
        // State
        let currentPage = 0;
        const pageSize = 50;
        let totalRecords = 0;
        let isStreaming = true; // Disable streaming if paginating

        function buildRows(txn) {
            const fragment = document.createDocumentFragment();
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50 cursor-pointer transition-colors';
            row.setAttribute('data-id', txn.id); 
            row.setAttribute('data-row-type', 'main');
            
            // Determine styles
            let riskColor = 'text-green-600 bg-green-50';
            let riskScore = txn.risk_score || Math.round((txn.fraud_probability || 0) * 100);
            
            if (riskScore > 80) riskColor = 'text-red-600 bg-red-50 font-bold';
            else if (riskScore > 50) riskColor = 'text-orange-600 bg-orange-50';

            let statusColor = 'bg-gray-100 text-gray-800';
            // Logic to determine status if not provided explicit string
            let status = txn.status || 'Processed';
            if (txn.fraud_prediction === 1) status = 'Blocked';
            else if (txn.fraud_prediction === 0) status = 'Approved';
            
            if (status === 'Approved') statusColor = 'bg-green-100 text-green-800';
            if (status === 'Blocked' || status === 'Declined') statusColor = 'bg-red-100 text-red-800';
            if (status === 'Flagged') statusColor = 'bg-orange-100 text-orange-800';
            
            // Ensure time format
            const timeStr = txn.time || txn.timestamp || new Date().toISOString();
            const displayTime = new Date(timeStr).toLocaleString();

            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-xs">${displayTime}</td>
                <td class="px-6 py-4 font-mono text-xs text-gray-600">${txn.id || txn.transaction_id}</td>
                <td class="px-6 py-4 font-medium text-gray-900">${txn.merchant || txn.user_id}</td>
                <td class="px-6 py-4 text-gray-900">$${(txn.amount || 0).toFixed(2)}</td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 rounded-full text-xs font-medium ${riskColor}">
                        ${riskScore}/100
                    </span>
                </td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColor}">
                        ${status}
                    </span>
                </td>
                 <td class="px-6 py-4">
                    <button class="text-blue-600 hover:text-blue-800 text-xs font-medium">Details</button>
                </td>
            `;

            // ... (keep creating detailsRow logic logic) ...
            
            // Need to recreate detailsRow logic since I'm replacing the function
             if (txn.top_features && txn.top_features.length > 0) {
                row.title = txn.top_features
                    .map(item => `${item.feature}: ${item.contribution.toFixed(3)}`)
                    .join(' | ');
            }

            const detailsRow = document.createElement('tr');
            detailsRow.className = 'hidden bg-gray-50';
            detailsRow.setAttribute('data-row-type', 'details');
            const detailsCell = document.createElement('td');
            detailsCell.colSpan = 7;
            detailsCell.className = 'px-6 py-3 text-xs text-gray-600';
            detailsCell.innerHTML = renderTopFeatures(txn.top_features);
            detailsRow.appendChild(detailsCell);

            row.onclick = () => {
                const hasFeatures = txn.top_features && txn.top_features.length > 0;
                 // If no features, maybe fetch them? For now show naive msg
                if (!hasFeatures) {
                    // detail message
                }
                detailsRow.classList.toggle('hidden');
            };

            fragment.appendChild(row);
            fragment.appendChild(detailsRow);
            return fragment;
        }

        function prependRow(txn) {
            if (!tbody || !isStreaming) return; // Don't prepend if browsing history
            
            // Remove duplicates check
            const existing = tbody.querySelector(`tr[data-id="${txn.id || txn.transaction_id}"]`);
            if (existing) return;

            tbody.prepend(buildRows(txn));
            
            // Limit rows if streaming
            const mainRows = Array.from(tbody.querySelectorAll('tr[data-row-type="main"]'));
            if (mainRows.length > pageSize) {
                const lastMain = mainRows[mainRows.length - 1];
                const lastDetails = lastMain.nextElementSibling;
                if (lastDetails && lastDetails.getAttribute('data-row-type') === 'details') {
                    lastDetails.remove();
                }
                lastMain.remove();
            }
            // Update total count locally just for visual hint? 
            // Better not to mess with totalRecords during stream as it might desync.
        }

        function loadTransactions() {
            const offset = currentPage * pageSize;
            
            // Disable buttons during load
            btnPrev.disabled = true;
            btnNext.disabled = true;
            tbody.style.opacity = '0.5';

            fetch(`${basePath}/api/transactions?limit=${pageSize}&offset=${offset}`)
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = '';
                    tbody.style.opacity = '1';
                    
                    data.transactions.forEach(txn => {
                        tbody.appendChild(buildRows(txn));
                    });
                    
                    // Update state
                    totalRecords = data.pagination.total;
                    updatePaginationUI();
                })
                .catch(err => {
                    console.error('Failed to load transactions:', err);
                    tbody.style.opacity = '1';
                });
        }
        
        function updatePaginationUI() {
            const start = currentPage * pageSize + 1;
            const end = Math.min((currentPage + 1) * pageSize, totalRecords);
            countDisplay.textContent = `Showing ${start}-${end} of ${totalRecords}`;
            
            btnPrev.disabled = currentPage === 0;
            btnNext.disabled = end >= totalRecords;
            
            // Only stream on first page
            isStreaming = (currentPage === 0);
        }

        // Event Listeners
        btnPrev.onclick = () => {
            if (currentPage > 0) {
                currentPage--;
                loadTransactions();
            }
        };
        
        btnNext.onclick = () => {
            if ((currentPage + 1) * pageSize < totalRecords) {
                currentPage++;
                loadTransactions();
            }
        };

        // Initial Load
        loadTransactions();

        if (window.EventSource) {
            const stream = new EventSource(`${basePath}/api/stream?interval_ms=2000`);
            stream.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Only prepend if on page 0
                    if (currentPage === 0 && data.transaction) {
                        prependRow(data.transaction);
                    }
                } catch (err) {
                    console.error('Stream parse error:', err);
                }
            };
        }

        function renderTopFeatures(topFeatures) {
            if (!Array.isArray(topFeatures) || topFeatures.length === 0) {
                return '<span class="text-gray-400">No explanation available</span>';
            }
            const items = topFeatures.map(item => {
                const val = item.value === null || item.value === undefined ? 'n/a' : item.value;
                return `<span class="inline-flex items-center px-2 py-1 mr-2 mb-2 bg-white border border-gray-200 rounded">
                    <strong class="mr-1">${item.feature}</strong>
                    <span class="text-gray-500">(${item.contribution.toFixed(3)})</span>
                    <span class="ml-2 text-gray-400">val: ${val}</span>
                </span>`;
            });
            return `<div class="flex flex-wrap">${items.join('')}</div>`;
        }
    });
</script>
{% endblock %}
