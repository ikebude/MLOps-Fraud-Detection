{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-900">All Transactions</h3>
        <div class="flex gap-2">
            <input type="text" id="search-txn" placeholder="Search ID or user…" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                <tr>
                    <th class="px-6 py-3 font-medium">Time</th>
                    <th class="px-6 py-3 font-medium">ID</th>
                    <th class="px-6 py-3 font-medium">User</th>
                    <th class="px-6 py-3 font-medium">Amount</th>
                    <th class="px-6 py-3 font-medium">Risk</th>
                    <th class="px-6 py-3 font-medium">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 text-sm" id="all-txn-table-body"></tbody>
        </table>
    </div>
    <div class="px-6 py-4 border-t border-gray-200">
        <span class="text-sm text-gray-500" id="txn-count">—</span>
    </div>
</div>
<script>
(function () {
    function row(r) {
        let riskCl = 'text-green-600 bg-green-50';
        if (r.risk_score > 80) riskCl = 'text-red-600 bg-red-50 font-bold';
        else if (r.risk_score > 50) riskCl = 'text-orange-600 bg-orange-50';
        let statusCl = 'bg-gray-100 text-gray-800';
        if (r.status === 'Approved') statusCl = 'bg-green-100 text-green-800';
        if (r.status === 'Declined') statusCl = 'bg-red-100 text-red-800';
        if (r.status === 'Flagged') statusCl = 'bg-orange-100 text-orange-800';
        // Format time if it's an ISO-like string, otherwise show raw
        let timeStr = r.time || '—';
        try {
            const d = new Date(r.time);
            if (!isNaN(d.getTime())) timeStr = d.toLocaleString();
        } catch (e) {}
        return `<tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-gray-500">${timeStr}</td>
            <td class="px-6 py-4 font-mono text-xs text-gray-600">${r.id}</td>
            <td class="px-6 py-4 font-medium text-gray-900">${r.merchant}</td>
            <td class="px-6 py-4 text-gray-900">${r.currency ? (r.currency + ' ') : ''}${Number(r.amount).toFixed(2)}</td>
            <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${riskCl}">${r.risk_score}</span></td>
            <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${statusCl}">${r.status}</span></td>
        </tr>`;
    }
    function render(list) {
        const tbody = document.getElementById('all-txn-table-body');
        const q = (document.getElementById('search-txn') || {}).value || '';
        const filtered = q ? list.filter(function (r) {
            return String(r.id).toLowerCase().includes(q.toLowerCase()) || String(r.merchant).toLowerCase().includes(q.toLowerCase());
        }) : list;
        tbody.innerHTML = filtered.map(row).join('');
        const cnt = document.getElementById('txn-count');
        if (cnt) cnt.textContent = 'Showing ' + filtered.length + (list.length !== filtered.length ? ' of ' + list.length : '') + ' transactions';
    }
    function load() {
        fetch('/api/data').then(function (res) { return res.json(); }).then(function (d) {
            window._txnList = (d.transactions || []);
            render(window._txnList);
        }).catch(function () { render([]); });
    }
    load();
    // Prefer SSE for live updates, fallback to polling
    if (typeof(EventSource) !== 'undefined') {
        try {
            var es = new EventSource('/stream/transactions');
            es.addEventListener('transactions', function (ev) {
                try {
                    var payload = JSON.parse(ev.data || '{}');
                    window._txnList = (payload.results || []).map(function (r) { return r; });
                    render(window._txnList);
                } catch (e) {}
            });
            es.onerror = function () { /* keep connection open; fallback to polling */ };
        } catch (e) { setInterval(load, 5000); }
    } else {
        setInterval(load, 5000);
    }
    var s = document.getElementById('search-txn');
    if (s) s.addEventListener('input', function () { render(window._txnList || []); });
})();
</script>
{% endblock %}
