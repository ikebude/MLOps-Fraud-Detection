{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Financial Loss Prevented</p>
        <h3 class="text-3xl font-bold text-green-600">$42,500.00</h3>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Total Monthly Transactions</p>
        <h3 class="text-3xl font-bold text-gray-900">12,482</h3>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Average Fraud Rate</p>
        <h3 class="text-3xl font-bold text-orange-600">0.82%</h3>
    </div>
</div>

<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <h3 class="text-lg font-semibold text-gray-900 mb-6">Summary Trend Chart</h3>
    <div class="h-64">
        <canvas id="execChart"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById('execChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
            datasets: [{
                label: 'Fraud Rate %',
                data: [0.9, 0.85, 0.82, 0.82],
                borderColor: '#F36000',
                tension: 0.1
            }]
        }
    });
</script>
{% endblock %}
