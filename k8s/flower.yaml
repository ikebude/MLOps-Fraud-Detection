apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: flower
        image: mlopsacr12345.azurecr.io/fraud-detection/airflow:latest
        command: ["celery"]
        args:
          - "--app=airflow.providers.celery.executors.celery_executor.app"
          - "--broker=redis://redis:6379/0"
          - "flower"
          - "--port=5555"
        ports:
        - containerPort: 5555
          name: http
        env:
        - name: AIRFLOW__CELERY__BROKER_URL
          value: "redis://redis:6379/0"
        - name: CELERY_BROKER_URL
          value: "redis://redis:6379/0"
        - name: FLOWER_PORT
          value: "5555"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: flower
  ports:
  - port: 5555
    targetPort: 5555
    protocol: TCP
    name: http
