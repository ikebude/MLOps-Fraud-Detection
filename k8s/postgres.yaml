apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mlops
data:
  01-init.sh: |
    #!/bin/bash
    set -e
    
    echo "Creating PostgreSQL users and databases..."
    
    # Create users as postgres superuser
    psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<-EOSQL
      CREATE ROLE mlflow WITH LOGIN PASSWORD 'Postgress99!' CREATEDB;
      CREATE ROLE airflow WITH LOGIN PASSWORD 'Postgress99!' CREATEDB;
    EOSQL
    
    echo "Creating mlflow database..."
    psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<-EOSQL
      CREATE DATABASE mlflow OWNER mlflow;
    EOSQL
    
    echo "Setting mlflow database privileges..."
    psql -v ON_ERROR_STOP=1 -U postgres -d mlflow <<-EOSQL
      ALTER SCHEMA public OWNER TO mlflow;
      GRANT ALL PRIVILEGES ON SCHEMA public TO mlflow;
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO mlflow;
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO mlflow;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO mlflow;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO mlflow;
    EOSQL
    
    echo "Creating airflow database..."
    psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<-EOSQL
      CREATE DATABASE airflow OWNER airflow;
    EOSQL
    
    echo "Setting airflow database privileges..."
    psql -v ON_ERROR_STOP=1 -U postgres -d airflow <<-EOSQL
      ALTER SCHEMA public OWNER TO airflow;
      GRANT ALL PRIVILEGES ON SCHEMA public TO airflow;
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO airflow;
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO airflow;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO airflow;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO airflow;
    EOSQL
    
    echo "PostgreSQL initialization completed successfully!"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mlops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: docker.io/library/postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: init
        configMap:
          name: postgres-init
          defaultMode: 0755
          items:
          - key: 01-init.sh
            path: 01-init.sh
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
