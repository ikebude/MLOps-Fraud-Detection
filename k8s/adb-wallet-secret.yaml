# OCI Autonomous Database Wallet Secret
# This secret contains the wallet files needed to connect to OCI ADB
# The wallet files are mounted into pods that need database access

apiVersion: v1
kind: Secret
metadata:
  name: adb-wallet
  namespace: mlops
type: Opaque
data:
  # Note: These will be populated by the deployment script
  # Using base64-encoded wallet files from the ZIP
  sqlnet.ora: ""
  tnsnames.ora: ""
  cwallet.sso: ""
  ewallet.pem: ""
  keystore.jks: ""
  truststore.jks: ""
