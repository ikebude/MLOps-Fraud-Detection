apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: mlflow
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/mlflow:2.10.1
        command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql://mlflow:Postgress99!@postgres:5432/mlflow", "--default-artifact-root", "s3://mlops-artifacts", "--allowed-hosts", "*", "--cors-allowed-origins", "*"]
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: MLFLOW_BACKEND_STORE_URI
          value: "postgresql://mlflow:Postgress99!@postgres:5432/mlflow"
        - name: MLFLOW_ARTIFACTS_DESTINATION
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_ARTIFACTS_DESTINATION
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: object-storage-config
              key: s3-endpoint-url
        - name: AWS_DEFAULT_REGION
          value: "af-johannesburg-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_secret_access_key
        - name: MLFLOW_PORT
          value: "5000"
        - name: MLFLOW_STATIC_PREFIX
          value: ""
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
