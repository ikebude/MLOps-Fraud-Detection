apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: mlflow
        image: mlopsacr12345.azurecr.io/fraud-detection/mlflow:latest
        command: ["mlflow", "server"]
        args:
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "5000"
          - "--backend-store-uri"
          - "postgresql://postgres:Ikebude99!@mlops-postgres.postgres.database.azure.com:5432/mlflow?sslmode=require"
          - "--default-artifact-root"
          - "wasbs://mlflow-artifacts@mlopsstorage12345.blob.core.windows.net/"
          - "--allowed-hosts"
          - "*"
          - "--cors-allowed-origins"
          - "*"
          - "--static-prefix"
          - "/mlflow"
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: AZURE_STORAGE_ACCOUNT
          value: "mlopsstorage12345"
        - name: AZURE_STORAGE_KEY
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: account-key
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: connection-string
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: connection-string
        livenessProbe:
          httpGet:
            path: /mlflow/
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /mlflow/
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
