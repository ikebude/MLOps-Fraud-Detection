apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudguard
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraudguard
  template:
    metadata:
      labels:
        app: fraudguard
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: fraudguard
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/fraudguard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: INFERENCE_SERVICE_URL
          value: "http://inference:8000"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: AIRFLOW_WEBSERVER_URL
          value: "http://airflow-webserver:8080"
        - name: FRAUDGUARD_BASE_PATH
          value: "/fraudguard"
        - name: FLASK_DEBUG
          value: "False"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: fraudguard
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: fraudguard
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
