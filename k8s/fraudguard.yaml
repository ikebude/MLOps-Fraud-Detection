apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudguard
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraudguard
  template:
    metadata:
      labels:
        app: fraudguard
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: fraudguard
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/fraudguard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        startupProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: INFERENCE_SERVICE_URL
          value: "http://inference:8000"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: AIRFLOW_WEBSERVER_URL
          value: "http://airflow-webserver:8080"
        - name: FLASK_DEBUG
          value: "False"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: fraudguard
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: fraudguard
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
