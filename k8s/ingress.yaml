apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-ingress-main
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
  - host: fraudguard.84.8.135.74.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fraudguard
            port:
              number: 5000
  - host: mlflow.84.8.135.74.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000
  - host: inference.84.8.135.74.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inference
            port:
              number: 8000
  - host: airflow.84.8.135.74.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: airflow-webserver
            port:
              number: 8080
  - host: flower.84.8.135.74.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flower
            port:
              number: 5555
