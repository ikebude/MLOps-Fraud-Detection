# Ingress Rules for All Services
# This routes traffic from a single external IP to all services using path-based routing

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-ingress
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Performance optimizations
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
  # Path-based routing - access via http://<ingress-ip>/<service-name>
  - http:
      paths:
      # Fraud Guard UI - http://<ip>/fraudguard
      - path: /fraudguard(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: fraudguard
            port:
              number: 5000
      # Flower - http://<ip>/flower
      - path: /flower(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: flower
            port:
              number: 5555

---
# MLflow requires no rewrite so it can serve /mlflow correctly
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-ingress-mlflow
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # MLflow UI - http://<ip>/mlflow
      - path: /mlflow
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000

---
# Airflow needs a URL prefix and no rewrite
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-ingress-airflow
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Airflow Web UI - http://<ip>/airflow
      - path: /airflow
        pathType: Prefix
        backend:
          service:
            name: airflow-webserver
            port:
              number: 8080

---
# Inference API - rewrite to remove /inference prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-ingress-inference
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /inference(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: inference
            port:
              number: 8000
