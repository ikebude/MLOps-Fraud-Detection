apiVersion: v1
kind: Namespace
metadata:
  name: mlops

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: object-storage-config
  namespace: mlops
data:
  s3-endpoint-url: "https://axjkxzqfxgqu.compat.objectstorage.af-johannesburg-1.oraclecloud.com"
  bucket: "mlops-artifacts"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: mlops
data:
  MLFLOW_ARTIFACTS_DESTINATION: "s3://mlops-artifacts"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: mlops
data:
  AIRFLOW__CORE__EXECUTOR: "CeleryExecutor"
  AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
  AIRFLOW__CORE__BASE_LOG_FOLDER: "/opt/airflow/logs"
  AIRFLOW__CELERY__BROKER_URL: "redis://redis:6379/0"