apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: inference
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/inference:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: CUMULATIVE_STATS_FILE
          value: "/data/cumulative_stats.json"
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: object-storage-config
              key: s3-endpoint-url
        - name: AWS_DEFAULT_REGION
          value: "af-johannesburg-1"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: FRAUD_API_MAX_BATCH_SIZE
          value: "10000"
        - name: FRAUD_API_INFERENCE_MAX_RECORDS
          value: "10000"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_secret_access_key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: inference-state
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: inference-config
      - name: inference-state
        persistentVolumeClaim:
          claimName: inference-state

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-state
  namespace: mlops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: inference
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
