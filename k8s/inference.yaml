apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: inference
        image: mlopsacr12345.azurecr.io/fraud-detection/inference:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: FRAUD_API_MAX_BATCH_SIZE
          value: "10000"
        - name: FRAUD_API_INFERENCE_MAX_RECORDS
          value: "10000"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: account-name
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: account-key
        - name: AZURE_STORAGE_ACCOUNT
          value: "mlopsstorage12345"
        - name: AZURE_STORAGE_KEY
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: account-key
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: storage-credentials
              key: connection-string
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: inference-config

---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: inference
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
