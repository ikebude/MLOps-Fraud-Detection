apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: inference
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/inference:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: object-storage-config
              key: s3-endpoint-url
        - name: AWS_DEFAULT_REGION
          value: "af-johannesburg-1"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: FRAUD_API_MAX_BATCH_SIZE
          value: "10000"
        - name: FRAUD_API_INFERENCE_MAX_RECORDS
          value: "10000"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_secret_access_key
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: inference-config

---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: inference
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
