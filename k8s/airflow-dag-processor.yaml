---
# DAG Processor for Airflow 3.x
# This component is responsible for parsing DAG files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-dag-processor
  template:
    metadata:
      labels:
        app: airflow-dag-processor
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: dag-processor
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/airflow:latest
        command: ["airflow", "dag-processor"]
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: airflow-conn
        - name: AIRFLOW__CORE__EXECUTOR
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CORE__EXECUTOR
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: "airflow.utils.net.get_host_ip_address"
        - name: AIRFLOW__WEBSERVER__SECRET_KEY
          value: "mlops-airflow-secret-key"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT
          value: "300"
        - name: AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT
          value: "300"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: PYTHONPATH
          value: "/opt/airflow/plugins:/opt/airflow/dags:/app"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_secret_access_key
        volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
        - name: app-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: models
          mountPath: /app/models
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: logs
        emptyDir: {}
      - name: app-config
        configMap:
          name: airflow-app-config
      - name: models
        emptyDir: {}

---
# Triggerer for Airflow 3.x (for deferrable operators)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-triggerer
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-triggerer
  template:
    metadata:
      labels:
        app: airflow-triggerer
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: triggerer
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/airflow:latest
        command: ["airflow", "triggerer"]
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: airflow-conn
        - name: AIRFLOW__CORE__EXECUTOR
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CORE__EXECUTOR
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: "airflow.utils.net.get_host_ip_address"
        - name: AIRFLOW__WEBSERVER__SECRET_KEY
          value: "mlops-airflow-secret-key"
        - name: AIRFLOW__CELERY__BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CELERY__BROKER_URL
        - name: AIRFLOW__CELERY__RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: airflow-result-backend
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: PYTHONPATH
          value: "/opt/airflow/plugins:/opt/airflow/dags:/app"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
        - name: app-config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: logs
        emptyDir: {}
      - name: app-config
        configMap:
          name: airflow-app-config
