apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: mlops
data:
  config.yaml: |
    mlflow:
      experiment_name: "fraud_detection"
      registered_model_name: "fraud_detection_model"
      tracking_uri: "http://mlflow:5000"
      artifact_location: "s3://mlops-artifacts"
      bucket: "mlops-artifacts"

    api:
      url: ${FRAUD_API_URL:-https://3consult-ng.com/fraud_api.php}
      max_batch_size: 10000
      max_records_per_run: 100000
      timeout_seconds: 60
      retries: 5
      backoff_factor: 2

    model:
      test_size: 0.2
      seed: 42
      threshold: 0.5
      params:
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 5
        subsample: 0.8
        colsample_bytree: 0.8
        scale_pos_weight: 1
        tree_method: "hist"
      path: "/app/models/fraud_detection_model.pkl"
