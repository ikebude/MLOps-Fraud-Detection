---
# Headless Service for worker DNS (required for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: airflow-worker-headless
  namespace: mlops
spec:
  clusterIP: None
  selector:
    app: airflow-worker
  ports:
  - port: 8793
    targetPort: 8793
    protocol: TCP
    name: worker-logs

---
# Airflow Worker (Celery) - StatefulSet for predictable DNS names
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-worker
  namespace: mlops
spec:
  serviceName: airflow-worker-headless
  replicas: 2
  selector:
    matchLabels:
      app: airflow-worker
  template:
    metadata:
      labels:
        app: airflow-worker
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: airflow-worker
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/airflow:2.10.1
        command: ["airflow", "celery", "worker"]
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql://airflow:Postgress99!@postgres:5432/airflow"
        - name: AIRFLOW__CORE__EXECUTOR
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CORE__EXECUTOR
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: "airflow.utils.net.getfqdn"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST
          value: "$(HOSTNAME).airflow-worker-headless.mlops.svc.cluster.local"
        - name: AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT
          value: "8793"
        - name: AIRFLOW__CELERY__BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CELERY__BROKER_URL
        - name: AIRFLOW__CELERY__RESULT_BACKEND
          value: "db+postgresql://airflow:Postgress99!@postgres:5432/airflow"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: AIRFLOW__WEBSERVER__SECRET_KEY
          value: "mlops-airflow-secret-key"
        - name: AIRFLOW__LOGGING__LOG_SERVER_ON
          value: "true"
        - name: AIRFLOW__LOGGING__LOG_SERVER_PORT
          value: "8793"
        - name: AIRFLOW__API__AUTH_BACKENDS
          value: "airflow.api.auth.backend.default"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: object-storage-config
              key: s3-endpoint-url
        - name: AWS_DEFAULT_REGION
          value: "af-johannesburg-1"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: PYTHONPATH
          value: "/opt/airflow/plugins:/opt/airflow/dags:/app"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_secret_access_key
        - name: TNS_ADMIN
          value: "/opt/oracle/wallet"
        volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
        - name: app-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: models
          mountPath: /app/models
        - name: adb-wallet
          mountPath: /opt/oracle/wallet
          readOnly: true
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "6Gi"
            cpu: "2000m"
      volumes:
      - name: logs
        emptyDir: {}
      - name: app-config
        configMap:
          name: airflow-app-config
          optional: true
      - name: models
        emptyDir: {}
      - name: adb-wallet
        secret:
          secretName: adb-wallet
          defaultMode: 0600

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-worker
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: airflow-worker
  ports:
  - port: 8793
    targetPort: 8793
    protocol: TCP
    name: worker-logs
