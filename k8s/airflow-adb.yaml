# DAG ConfigMap - Note: DAGs are also built into the Docker image
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: mlops
data:
  # DAGs are built into the image at /opt/airflow/dags

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      imagePullSecrets:
      - name: ocir-secret
      initContainers:
      - name: init-db
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/airflow:2.10.1
        command: ["sh", "-c"]
        args:
          - |
            set -e
            echo "Airflow database already initialized"
            echo "Skipping db init for pod startup"
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: adb-credentials
              key: airflow-conn
        - name: AIRFLOW__CORE__EXECUTOR
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CORE__EXECUTOR
        - name: TNS_ADMIN
          value: "/opt/oracle/wallet"
        volumeMounts:
        - name: adb-wallet
          mountPath: /opt/oracle/wallet
          readOnly: true
      containers:
      - name: airflow-webserver
        image: af-johannesburg-1.ocir.io/axjkxzqfxgqu/fraud-detection/airflow:2.10.1
        command: ["airflow", "webserver"]
        ports:
        - containerPort: 8080
          name: webserver
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql://airflow:Postgress99!@postgres:5432/airflow"
        - name: AIRFLOW__CORE__EXECUTOR
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CORE__EXECUTOR
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: "airflow.utils.net.getfqdn"
        - name: AIRFLOW__CELERY__BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: AIRFLOW__CELERY__BROKER_URL
        - name: AIRFLOW__CELERY__RESULT_BACKEND
          value: "db+postgresql://airflow:Postgress99!@postgres:5432/airflow"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: AIRFLOW__WEBSERVER__WEB_SERVER_URL_PREFIX
          value: "/airflow"
        - name: AIRFLOW__WEBSERVER__BASE_LOG_FOLDER
          value: "/opt/airflow/logs"
        - name: AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX
          value: "true"
        - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
          value: "true"
        - name: AIRFLOW__WEBSERVER__SECRET_KEY
          value: "mlops-airflow-secret-key"
        - name: AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE
          value: "false"
        - name: AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST
          value: "localhost"
        - name: AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT
          value: "8793"
        - name: AIRFLOW__CORE__LOG_SERVER_ON
          value: "true"
        - name: AIRFLOW__WEBSERVER__LOG_FETCH_TIMEOUT_SEC
          value: "5"
        - name: AIRFLOW__API__AUTH_BACKENDS
          value: "airflow.api.auth.backend.default"
        - name: AIRFLOW__CORE__LOG_FETCHER_PARSING_NUM_LINES
          value: "1000"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: object-storage-config
              key: s3-endpoint-url
        - name: AWS_DEFAULT_REGION
          value: "af-johannesburg-1"
        - name: FRAUD_API_URL
          value: "https://3consult-ng.com/fraud_api.php"
        - name: PYTHONPATH
          value: "/opt/airflow/plugins:/opt/airflow/dags:/app"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-credentials
              key: aws_secret_access_key
        - name: TNS_ADMIN
          value: "/opt/oracle/wallet"
        volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
        - name: app-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: models
          mountPath: /app/models
        - name: adb-wallet
          mountPath: /opt/oracle/wallet
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 600
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: logs
        emptyDir: {}
      - name: app-config
        configMap:
          name: airflow-app-config
          optional: true
      - name: models
        emptyDir: {}
      - name: adb-wallet
        secret:
          secretName: adb-wallet
          defaultMode: 0600

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: airflow-webserver
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: webserver

---
